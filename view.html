<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подключение | SvarkaSC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background-color: #1e1e1e; color: #ccc; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background-color: #252526; border: 1px solid #444; border-radius: 15px; padding: 40px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #fff; margin-top: 0; margin-bottom: 30px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; background-color: #111; border: 1px solid #555; color: #89d185; padding: 12px; border-radius: 8px; font-size: 18px; font-family: 'Consolas', monospace; text-align: center; letter-spacing: 2px; outline: none; }
        input:focus { border-color: #0e639c; }
        button { background-color: #0e639c; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #1177bb; }
        p { font-size: 14px; color: #888; line-height: 1.5; }
        .status { margin-top: 20px; font-weight: bold; color: #89d185; display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Подключение к сессии</h2>
        
        <div class="input-group">
            <input type="text" id="code-input" placeholder="SVK-1234" maxlength="10">
            <button onclick="connect()">Войти</button>
        </div>
        
        <p>Введите код, который показан на главном устройстве (в IDE).</p>
        
        <div class="status" id="status-msg">
            <i class="fa-solid fa-spinner fa-spin"></i> Ожидание подключения...
        </div>
    </div>

    <script>
        function connect() {
            const code = document.getElementById('code-input').value;
            const status = document.getElementById('status-msg');
            
            if(!code) {
                alert("Пожалуйста, введите код устройства!");
                return;
            }

            status.style.display = 'block';
            status.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Подключение к ' + code + '...';
            status.style.color = '#75beff';

            // Имитация задержки сети
            setTimeout(() => {
                status.innerHTML = '<i class="fa-solid fa-check"></i> Устройство найдено! Синхронизация...';
                status.style.color = '#89d185';
                
                setTimeout(() => {
                    alert("Успешно подключено! (В будущем здесь откроется интерфейс второго экрана)");
                }, 1000);
            }, 1500);
        }
    </script>
</body>
</html>
