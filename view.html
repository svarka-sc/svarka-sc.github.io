<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подключение | SvarkaSC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; background-color: #1e1e1e; color: #ccc; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background-color: #252526; border: 1px solid #444; border-radius: 15px; padding: 40px 30px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #fff; margin-top: 0; margin-bottom: 30px; font-size: 24px; }
        .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        input { width: 100%; background-color: #111; border: 2px solid #555; color: #89d185; padding: 15px; border-radius: 8px; font-size: 24px; font-family: 'Consolas', monospace; text-align: center; letter-spacing: 5px; outline: none; text-transform: uppercase; box-sizing: border-box;}
        input:focus { border-color: #0e639c; }
        button { width: 100%; background-color: #0e639c; color: #fff; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #1177bb; }
        p { font-size: 14px; color: #888; line-height: 1.5; margin-bottom: 20px;}
        .status { margin-top: 20px; font-weight: bold; color: #89d185; display: none; font-size: 14px;}
    </style>
</head>
<body>

    <div class="card">
        <h2><i class="fa-solid fa-link"></i> Подключение</h2>
        
        <p>Введи код комнаты, который показан в главном окне IDE на другом устройстве.</p>

        <div class="input-group">
            <input type="text" id="code-input" placeholder="TEST123" maxlength="10">
            <button onclick="connect()">Войти в комнату</button>
        </div>
        
        <div class="status" id="status-msg">
            <i class="fa-solid fa-spinner fa-spin"></i> Подключение...
        </div>
    </div>

    <script>
        function connect() {
            const code = document.getElementById('code-input').value.trim().toUpperCase();
            const status = document.getElementById('status-msg');
            
            if(!code) {
                alert("Пожалуйста, введите код комнаты!");
                return;
            }

            status.style.display = 'block';
            status.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Поиск комнаты ' + code + '...';
            status.style.color = '#75beff';

            // Имитация проверки (В реальности здесь будет переход на index.html с параметром ?room=CODE)
            setTimeout(() => {
                status.innerHTML = '<i class="fa-solid fa-check"></i> Устройство найдено! Переход...';
                status.style.color = '#89d185';
                
                setTimeout(() => {
                    // Перенаправляем на главную IDE с кодом комнаты в ссылке
                    window.location.href = `index.html?room=${code}`;
                }, 1000);
            }, 1500);
        }
    </script>
</body>
</html>
