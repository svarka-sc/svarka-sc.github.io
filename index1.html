<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SvarkaSC Studio | Web IDE</title>
    
    <!-- CodeMirror -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    
    <!-- Иконки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-main: #1e1e1e; --bg-panel: #252526; --bg-top: #333333;
            --accent: #0e639c; --text-main: #cccccc; --text-muted: #888;
            --border: #111; --term-bg: #0d0d0d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .topbar { background-color: var(--bg-top); height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid var(--border); z-index: 10; flex-shrink: 0; }
        .logo { font-weight: bold; color: #fff; font-size: 15px; display: flex; align-items: center; gap: 8px; }
        .logo i { color: var(--accent); }
        
        .actions { display: flex; gap: 8px; align-items: center; }
        .btn { background: #444; color: #fff; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: 0.2s; text-decoration: none;}
        .btn:hover { background: #555; }
        .btn-run { background: #238636; font-weight: bold; }
        .btn-run:hover { background: #2ea043; }
        .btn-connect { background: #8a2be2; }
        .btn-connect:hover { background: #9b4dff; }

        /* РАБОЧАЯ ОБЛАСТЬ */
        .workspace { display: flex; flex: 1; overflow: hidden; }

        /* Левая панель (Файлы) */
        .sidebar { width: 200px; background-color: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-section { padding: 12px 15px; font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: bold; }
        .file-item { padding: 8px 15px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: #ccc; }
        .file-item:hover { background: #2a2d2e; }
        .file-item.active { background: #37373d; color: #fff; border-left: 2px solid var(--accent); }

        /* Центральная часть */
        .main-content { flex: 1; display: flex; flex-direction: column; }
        .split-view { display: flex; flex: 1; overflow: hidden; }
        
        /* Редактор */
        .editor-container { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border); }
        .editor-header { background: var(--bg-panel); height: 35px; display: flex; align-items: center; }
        .tab { padding: 0 15px; display: flex; align-items: center; gap: 8px; font-size: 13px; border-top: 1px solid var(--accent); background: var(--bg-main); color: #fff; height: 100%; }
        .CodeMirror { flex: 1; height: 100% !important; font-size: 14px; font-family: 'Consolas', monospace; }

        /* Превью */
        .preview-container { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .preview-header { background: var(--bg-panel); padding: 5px 15px; font-size: 12px; color: #ccc; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); height: 35px; align-items: center; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }

        /* Терминал */
        .terminal { height: 220px; background: var(--term-bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; }
        .term-header { background: var(--bg-panel); padding: 5px 15px; font-size: 12px; color: #ccc; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); align-items: center; }
        .term-output { flex: 1; padding: 10px 15px; font-family: 'Consolas', monospace; font-size: 13px; color: #89d185; overflow-y: auto; }
        .term-input-line { display: flex; padding: 10px 15px; background: var(--term-bg); border-top: 1px solid #222; }
        .term-prompt { color: var(--accent); margin-right: 10px; font-family: monospace; font-weight: bold; }
        .term-input-line input { flex: 1; background: transparent; border: none; color: #fff; outline: none; font-family: 'Consolas', monospace; font-size: 13px; }

        /* Статус бар */
        .statusbar { height: 25px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 11px; flex-shrink: 0; }
        #status-room.connected { background: #238636; }

        /* МОДАЛЬНОЕ ОКНО */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--bg-panel); padding: 30px 20px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #444; }
        .modal-content h3 { color: #fff; margin-bottom: 20px; font-size: 20px; }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 15px; background: #111; border: 1px solid #555; color: #89d185; border-radius: 8px; font-family: monospace; text-align: center; font-size: 20px; letter-spacing: 2px; outline: none; text-transform: uppercase; }
        .modal-content button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px; font-size: 16px; }
        .modal-content .close-btn { background: #444; }

        /* МОБИЛЬНАЯ ВЕРСИЯ */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .split-view { flex-direction: column; }
            .editor-container { border-right: none; border-bottom: 1px solid var(--border); }
            .terminal { height: 30vh; }
            
            .btn .btn-text { display: none; } /* Оставляем только иконки на телефоне */
            .btn { padding: 10px; font-size: 16px; }
            
            /* Нижняя навигация */
            .mobile-nav { display: flex; background: var(--bg-panel); height: 60px; border-top: 1px solid var(--border); flex-shrink: 0; }
            .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; font-size: 10px; cursor: pointer; gap: 4px; }
            .nav-item i { font-size: 18px; }
            .nav-item.active { color: var(--accent); }

            /* Скрываем все панели по умолчанию */
            .pane { display: none; flex: 1; height: 100%; overflow: hidden; }
            .pane.active { display: flex; flex-direction: column; }
        }

        @media (min-width: 769px) {
            .mobile-nav { display: none; }
            .pane { display: flex !important; } /* На ПК все панели видны */
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
    <div class="topbar">
        <div class="logo"><i class="fa-solid fa-code"></i> SvarkaSC Studio</div>
        <div class="actions">
            <button class="btn btn-connect" onclick="openConnectModal()"><i class="fa-solid fa-link"></i> <span class="btn-text">Подключить</span></button>
            <a href="terminal.html" target="_blank" class="btn"><i class="fa-solid fa-terminal"></i> <span class="btn-text">Терминал</span></a>
            <button class="btn btn-run" onclick="runBuild()"><i class="fa-solid fa-play"></i> <span class="btn-text">Запуск</span></button>
        </div>
    </div>

    <!-- РАБОЧАЯ ОБЛАСТЬ -->
    <div class="workspace">
        <!-- Левая панель -->
        <div class="sidebar">
            <div class="sidebar-section">📁 Проводник</div>
            <div class="file-item active"><i class="fa-brands fa-html5" style="color:#e34c26;"></i> main.html</div>
        </div>

        <!-- Центральная часть -->
        <div class="main-content">
            <div class="split-view">
                
                <!-- Редактор -->
                <div class="pane active" id="pane-editor">
                    <div class="editor-header">
                        <div class="tab"><i class="fa-brands fa-html5" style="color:#e34c26;"></i> main.html</div>
                    </div>
                    <textarea id="code-editor"></textarea>
                </div>

                <!-- Превью -->
                <div class="pane" id="pane-preview">
                    <div class="preview-header">
                        <span><i class="fa-solid fa-eye"></i> Живой предпросмотр</span>
                        <span id="preview-status" style="color:#89d185;"><i class="fa-solid fa-check"></i> Готово</span>
                    </div>
                    <iframe id="preview-frame"></iframe>
                </div>

            </div>
        </div>
    </div>

    <!-- ТЕРМИНАЛ -->
    <div class="terminal pane" id="pane-terminal">
        <div class="term-header">
            <span><i class="fa-solid fa-terminal"></i> Diodo Shell</span>
            <span style="cursor:pointer;" onclick="clearTerm()"><i class="fa-solid fa-trash"></i></span>
        </div>
        <div class="term-output" id="term-output">
            <div>Diodo Compiler v1.0.0 (Web Edition)</div>
        </div>
        <div class="term-input-line">
            <span class="term-prompt">&gt;</span>
            <input type="text" id="term-cmd" autocomplete="off" placeholder="Команда...">
        </div>
    </div>

    <!-- СТАТУС БАР -->
    <div class="statusbar" id="statusbar">
        <div id="status-room"><i class="fa-solid fa-code-branch"></i> Локальный режим</div>
        <div>UTF-8 | SvarkaSC</div>
    </div>

    <!-- МОБИЛЬНАЯ НАВИГАЦИЯ -->
    <div class="mobile-nav">
        <div class="nav-item active" onclick="switchMobile('editor', this)"><i class="fa-solid fa-code"></i> Код</div>
        <div class="nav-item" onclick="switchMobile('preview', this)"><i class="fa-solid fa-eye"></i> Превью</div>
        <div class="nav-item" onclick="switchMobile('terminal', this)"><i class="fa-solid fa-terminal"></i> Терминал</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal" id="connectModal">
        <div class="modal-content">
            <h3>Синхронизация</h3>
            <p style="font-size:13px; color:#aaa; margin-bottom:20px;">Придумай код комнаты (например, TEST123) и введи его на обоих устройствах.</p>
            <input type="text" id="room-code-input" placeholder="TEST123" maxlength="10">
            <button onclick="connectToRoom()">Подключиться</button>
            <button class="close-btn" onclick="closeConnectModal()">Отмена</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. SUPABASE (КЛЮЧИ УЖЕ ВСТАВЛЕНЫ)
        // ==========================================
        const SUPABASE_URL = 'https://amlugbaddztmbxegzmxz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_h-g8RgSkkIFb7uqLrpx4xQ_W_9qDjdy';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let roomChannel = null;
        let isRemoteUpdate = false;

        // ==========================================
        // 2. РЕДАКТОР И ПРЕВЬЮ
        // ==========================================
        var editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
            lineNumbers: true, mode: "htmlmixed", theme: "dracula", lineWrapping: true, indentUnit: 4
        });

        editor.setValue(`<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 50px; background: #f0f4f8; color: #333; }
        h1 { color: #0e639c; }
        button { padding: 12px 24px; font-size: 16px; background: #0e639c; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1177bb; transform: scale(1.05); }
    </style>
</head>
<body>
    <h1>SvarkaSC Studio</h1>
    <p>Открой этот сайт на другом устройстве, подключись к комнате <b>TEST123</b> и начни печатать код. Он появится здесь!</p>
    <button onclick="alert('Синхронизация работает!')">Проверить связь</button>
</body>
</html>`);

        const previewFrame = document.getElementById("preview-frame");
        const previewStatus = document.getElementById("preview-status");
        let typingTimer;

        function updatePreview() {
            const code = editor.getValue();
            const frameDoc = previewFrame.contentDocument || previewFrame.contentWindow.document;
            frameDoc.open(); frameDoc.write(code); frameDoc.close();
            
            previewStatus.innerHTML = '<i class="fa-solid fa-check"></i> Готово';
        }

        editor.on("change", function() {
            updatePreview();
            if (!isRemoteUpdate && roomChannel) {
                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => {
                    roomChannel.send({ type: 'broadcast', event: 'code-update', payload: { code: editor.getValue() } });
                }, 300);
            }
        });
        setTimeout(updatePreview, 100);

        // ==========================================
        // 3. SUPABASE CONNECT
        // ==========================================
        function openConnectModal() { document.getElementById('connectModal').style.display = 'flex'; }
        function closeConnectModal() { document.getElementById('connectModal').style.display = 'none'; }

        async function connectToRoom() {
            const code = document.getElementById('room-code-input').value.trim().toUpperCase();
            if (!code) return alert('Введите код комнаты!');

            closeConnectModal();
            const statusBar = document.getElementById('status-room');
            statusBar.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Подключение к ${code}...`;

            await supabaseClient.auth.signInAnonymously();
            if (roomChannel) await supabaseClient.removeChannel(roomChannel);

            roomChannel = supabaseClient.channel(`room:${code}`, { config: { broadcast: { self: false } } });

            roomChannel.on('broadcast', { event: 'code-update' }, (payload) => {
                isRemoteUpdate = true;
                const cursor = editor.getCursor();
                editor.setValue(payload.payload.code);
                editor.setCursor(cursor);
                updatePreview();
                isRemoteUpdate = false;
                previewStatus.innerHTML = '<i class="fa-solid fa-sync"></i> Синхр.';
            });

            roomChannel.subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    statusBar.innerHTML = `<i class="fa-solid fa-link"></i> Комната: ${code}`;
                    document.getElementById('statusbar').classList.add('connected');
                }
            });
        }

        // ==========================================
        // 4. ТЕРМИНАЛ
        // ==========================================
        const termOutput = document.getElementById("term-output");
        const termInput = document.getElementById("term-cmd");

        function printTerm(text, color = "#89d185") {
            const div = document.createElement("div");
            div.style.color = color; div.innerText = text;
            termOutput.appendChild(div); termOutput.scrollTop = termOutput.scrollHeight;
        }

        function clearTerm() { termOutput.innerHTML = ""; }

        function runBuild() {
            printTerm("> diodo build main.html", "#0e639c");
            setTimeout(() => printTerm("Сборка..."), 400);
            setTimeout(() => printTerm("✅ [УСПЕХ] Файл app.esx готов!"), 1200);
            updatePreview();
        }

        termInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                const cmd = termInput.value.trim();
                termInput.value = "";
                if (!cmd) return;
                printTerm("> " + cmd, "#fff");
                if (cmd === "clear") clearTerm();
                else if (cmd === "build") runBuild();
                else printTerm(`Команда '${cmd}' не найдена.`, "#f48771");
            }
        });

        // ==========================================
        // 5. МОБИЛЬНАЯ НАВИГАЦИЯ
        // ==========================================
        function switchMobile(pane, element) {
            if(window.innerWidth > 768) return; // Не работает на ПК

            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
            
            document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
            document.getElementById('pane-' + pane).classList.add('active');
        }
    </script>
</body>
</html>
